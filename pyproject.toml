[project]
name = "greentechhub-fastapi"
version = "0.5.0"
description = "FastAPI/Starlette adapter package: turns greentechhub-core's framework-independent contracts into middleware, dependencies, and routers for the GreenTechHub ecosystem"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastapi-pagination>=0.15",
    "itsdangerous>=2.1",
    "greentechhub-core @ git+https://github.com/GreenMachine582/greentechhub-core.git@v0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/greentechhub_fastapi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
